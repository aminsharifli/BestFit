name: bestfit

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: bestfit
      POSTGRES_PASSWORD: bestfit
      POSTGRES_DB: bestfit
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db:/db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bestfit -d bestfit"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
